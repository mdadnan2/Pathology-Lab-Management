version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathlab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pathlab
      POSTGRES_PASSWORD: pathlab_dev_password
      POSTGRES_DB: pathlab_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pathlab -d pathlab_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
